name: Release

# Tag a version to publish:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tooling
        run: npm ci || npm install

      - name: Sanity check - render.ps1 must stay pure ASCII
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("src/render.ps1")
          $bad = @($bytes | Where-Object { $_ -gt 127 })
          if ($bad.Count -gt 0) {
            throw "render.ps1 contains $($bad.Count) non-ASCII bytes. PowerShell 5.1 reads BOM-less .ps1 as ANSI and would mangle them."
          }
          Write-Host "render.ps1 is pure ASCII."

      - name: Build the executable
        run: npm run build:exe

      - name: Smoke test
        shell: pwsh
        run: |
          $v = & ".\dist\ai-news-wallpaper.exe" --version
          if (-not $v) { throw "--version produced no output" }
          Write-Host "version: $v"
          & ".\dist\ai-news-wallpaper.exe" quote
          # Renders without touching the runner's wallpaper; proves the
          # embedded render.ps1 asset unpacks and GDI+ draws.
          & ".\dist\ai-news-wallpaper.exe" preview --no-tools --out "$env:RUNNER_TEMP\smoke.png"
          if (-not (Test-Path "$env:RUNNER_TEMP\smoke.png")) { throw "preview produced no image" }
          $size = (Get-Item "$env:RUNNER_TEMP\smoke.png").Length
          Write-Host "rendered $([Math]::Round($size/1KB)) KB"

      - name: Publish to the release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ai-news-wallpaper.exe
          generate_release_notes: true
          body: |
            ## Install

            ```powershell
            irm https://kshivam4781.github.io/ainewswallpaper/install.ps1 | iex
            ```

            Or download `ai-news-wallpaper.exe` below and run it.

            The binary is unsigned, so Windows SmartScreen shows a warning on
            first run: click **More info** then **Run anyway**.
